<style>
/* 1. Global Wrapper */
.cla-wrapper {
    width: 100%;
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 20px;
    box-sizing: border-box;
}

/* 2. Main Hero Image (Adjusts height for mobile) */
.cla-main-feature-img img {
    width: 100%;
    height: 500px; /* Desktop height */
    object-fit: cover;
    border-radius: 4px;
    box-shadow: 0 15px 40px rgba(0,0,0,0.08);
}

/* 3. The Grid (Changes from 3 columns to 1 on mobile) */
.cla-photo-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 30px;
}

.cla-gallery-item img {
    width: 100%;
    height: 300px;
    object-fit: cover;
    border-radius: 4px;
}

/* 4. Typography Scalability */
.cla-journal-header h1 {
    font-family: 'Georgia', serif;
    font-size: 3rem;
    color: #1a1a1a;
    margin-bottom: 10px;
}

/* ==========================================
   MOBILE RESPONSIVENESS (The Magic)
   ========================================== */
@media (max-width: 768px) {
    .cla-main-feature-img img {
        height: 300px; /* Shrinks the big image so it's not a long scroll */
    }

    .cla-journal-header h1 {
        font-size: 2rem; /* Shrinks title so it doesn't break lines awkwardly */
    }

    .cla-photo-grid {
        grid-template-columns: 1fr; /* Forces images to stack vertically */
        gap: 20px;
    }

    .cla-gallery-item img {
        height: 250px; /* Adjusts grid image height for phones */
    }
}
