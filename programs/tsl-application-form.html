<script>
    function goToStep(s) {
        document.querySelectorAll('.step').forEach(d => d.style.display = 'none');
        document.getElementById('step'+s).style.display = 'block';
        window.scrollTo({ top: document.getElementById('tsl-app-container').offsetTop - 20, behavior: 'smooth' });
    }
</script>
<script>
// 1. Navigation Logic with Step Validation
window.goToStep = function(stepNumber) {
    // VALIDATION: Step 1 -> Step 2
    if (stepNumber === 2) {
        const requiredIds = ['surname', 'firstname', 'email', 'phone', 'address', 'citizenship'];
        const isCatholic = document.querySelector('input[name="catholic"]:checked');
        
        for (let id of requiredIds) {
            const el = document.getElementById(id);
            if (!el || !el.value.trim()) {
                alert("Please fill in all mandatory fields marked with *");
                if(el) el.focus();
                return;
            }
        }
        if (!isCatholic) {
            alert("Please indicate your Catholic status.");
            return;
        }
    }

    // VALIDATION: Step 2 -> Step 3
    if (stepNumber === 3) {
        if (!document.getElementById('hours').value || !document.getElementById('pc_status').value) {
            alert("Please select your weekly commitment hours and PC/Data status.");
            return;
        }
    }

    // VALIDATION: Step 3 -> Step 4
    if (stepNumber === 4) {
        const education = document.getElementById('education').value;
        const cv = document.getElementById('file_cv').files[0];
        const statement = document.getElementById('file_statement').files[0];
        
        if (!education) { alert("Please select your educational background."); return; }
        if (!cv) { alert("Please upload your CV."); return; }
        if (!statement) { alert("Please upload your Personal Statement."); return; }
    }

    // Navigation Execution
    document.querySelectorAll('.step').forEach(step => step.style.display = 'none');
    const target = document.getElementById('step' + stepNumber);
    if(target) {
        target.style.display = 'block';
        window.scrollTo(0, 0);
    }
};

// 2. Final Submission Logic
document.addEventListener('DOMContentLoaded', function() {
    const tslForm = document.getElementById('tsl-master-form');
    
    if (tslForm) {
        tslForm.addEventListener('submit', async function(e) {
            e.preventDefault();
            
            // VALIDATION: Get the 6 Recommender Fields (Names, Emails, Phones)
            const r1Name = document.getElementById('rec1_name')?.value.trim();
            const r1Email = document.getElementById('rec1_email')?.value.trim();
            const r1Phone = document.getElementById('rec1_phone')?.value.trim();
            const r2Name = document.getElementById('rec2_name')?.value.trim();
            const r2Email = document.getElementById('rec2_email')?.value.trim();
            const r2Phone = document.getElementById('rec2_phone')?.value.trim();

            // Check if any recommender details are missing
            if (!r1Name || !r1Email || !r1Phone || !r2Name || !r2Email || !r2Phone) {
                alert("Please complete all details for both recommenders before submitting.");
                return;
            }

            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.innerHTML = "Processing...";

            const toBase64 = file => new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result.split(',')[1]);
                reader.onerror = error => reject(error);
            });

            try {
                const cvFile = document.getElementById('file_cv').files[0];
                const psFile = document.getElementById('file_statement').files[0];

                const payload = {
                    surname: document.getElementById('surname').value,
                    firstname: document.getElementById('firstname').value,
                    othernames: document.getElementById('othernames').value,
                    gender: document.getElementById('gender').value,
                    email: document.getElementById('email').value,
                    phone: document.getElementById('phone').value,
                    address: document.getElementById('address').value,
                    citizenship: document.getElementById('citizenship').value,
                    isCatholic: document.querySelector('input[name="catholic"]:checked')?.value || "N/A",
                    parish: document.getElementById('parish').value,
                    referral: document.getElementById('referral').value,
                    pastPrograms: document.getElementById('past_programs').value,
                    hours: document.getElementById('hours').value,
                    summerWilling: document.getElementById('summer_willing').value,
                    pcStatus: document.getElementById('pc_status').value,
                    education: document.getElementById('education').value,
                    
                    // DATA CAPTURE FOR RECOMMENDERS
                    rec1_name: r1Name,
                    rec1_email: r1Email,
                    rec1_phone: r1Phone,
                    rec2_name: r2Name,
                    rec2_email: r2Email,
                    rec2_phone: r2Phone,

                    cvFile: await toBase64(cvFile),
                    cvName: cvFile.name,
                    cvType: cvFile.type,
                    psFile: await toBase64(psFile),
                    psName: psFile.name,
                    psType: psFile.type
                };

                // Using your Google Apps Script URL
                fetch('https://script.google.com/macros/s/AKfycbzaIA4cKlm--k8TpBZDGv1pUs-JEiWAysAuoOCvkiMzRcdNCUGmrl9DjS1y1kv4tJSj/exec', {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: new URLSearchParams(payload)
                }).then(() => {
                    document.getElementById('tsl-master-form').style.display = 'none';
                    const success = document.getElementById('success-msg');
                    if(success) success.style.display = 'block';
                    window.scrollTo(0,0);
                }).catch(err => {
                    console.error(err);
                    alert("Submission error. Please check your connection.");
                    btn.disabled = false;
                    btn.innerHTML = "SUBMIT APPLICATION";
                });

            } catch (err) {
                console.error(err);
                alert("An error occurred while processing your files. Please try again.");
                btn.disabled = false;
                btn.innerHTML = "SUBMIT APPLICATION";
            }
        });
    }
});
</script>
