<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Church Life Africa | Application Closed</title>
  
  <link rel="stylesheet" href="/assets/css/style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <link rel="stylesheet" href="/assets/css/header.css">
</head>

<body>
<div id="header"></div>
<main id="cla-tribe-portal">
  <style>
    #cla-tribe-portal {
      padding-top: 160px; 
      padding-bottom: 80px;
      --maroon: #6B1D2A;
      --gold: #C9A84C;
      --cream: #FDFAF5;
      --edge: #E8DDD4;
      --ink: #1A1210;
      --muted: #5C5249;
      --white: #FFFFFF;
      background: var(--cream);
      color: var(--ink);
      font-family: 'DM Sans', sans-serif;
      line-height: 1.6;
      min-height: 70vh; /* Ensures the page doesn't look empty */
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .closed-container { 
      max-width: 600px; 
      margin: 0 auto; 
      padding: 60px 30px; 
      text-align: center;
      background: var(--white);
      border: 1px solid var(--edge);
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.02);
      animation: fadeIn 0.5s ease;
    }

    @keyframes fadeIn { 
      from { opacity: 0; transform: translateY(10px); } 
      to { opacity: 1; transform: translateY(0); } 
    }

    .closed-container h1 { 
      font-family: 'Cormorant Garamond', serif; 
      font-size: 40px; 
      color: var(--maroon); 
      margin-bottom: 15px; 
      line-height: 1.2; 
    }

    .closed-container p { 
      color: var(--muted); 
      font-size: 16px; 
      margin-bottom: 35px; 
    }

    .btn-home { 
      display: inline-block;
      padding: 14px 30px; 
      border-radius: 12px; 
      font-weight: 700; 
      text-decoration: none;
      background: var(--gold); 
      color: white; 
      transition: 0.2s; 
      border: none; 
      font-size: 15px; 
    }

    .btn-home:hover { 
      background: #B8933A; 
    }

    @media (max-width: 600px) { 
      #cla-tribe-portal { padding-top: 130px; } 
      .closed-container { padding: 40px 20px; border: none; background: transparent; box-shadow: none;}
    }
  </style>

  <div class="closed-container">
    <div style="font-size:50px; margin-bottom:15px;">⏳</div>
    <h1>Applications Closed</h1>
    <p>Thank you for your interest in joining a Church Life Africa Tribe. The application window has officially closed. Please stay tuned to our communications for future opportunities.</p>
    <a href="/" class="btn-home">Return to Homepage</a>
  </div>

</main>

<footer>
  <p>&copy; <span id="year"></span> Church Life Africa</p>
</footer>

<script src="/assets/js/main.js" defer></script>
<script src="/assets/js/header.js" defer></script>
</body>
</html>
