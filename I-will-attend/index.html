<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendee Badge Generator | CLA</title>
    <style>
        body { font-family: 'Georgia', serif; background: #1a1a1a; color: white; display: flex; flex-direction: column; align-items: center; padding: 20px; }
        .container { background: #ffffff; color: #333; padding: 30px; border-radius: 12px; box-shadow: 0 10px 40px rgba(0,0,0,0.5); max-width: 500px; text-align: center; border-top: 8px solid #f4b41a; }
        h2 { color: #002147; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 5px; }
        #canvas { width: 100%; border-radius: 8px; margin-top: 20px; display: none; box-shadow: 0 5px 15px rgba(0,0,0,0.2); }
        .input-group { margin-bottom: 15px; text-align: left; }
        label { font-weight: bold; display: block; margin-bottom: 5px; color: #002147; }
        input[type="text"], input[type="file"] { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }
        .btn { background: #800000; color: white; border: none; padding: 15px 25px; border-radius: 6px; font-weight: bold; cursor: pointer; text-transform: uppercase; letter-spacing: 2px; width: 100%; font-size: 16px; margin-top: 20px; }
        .btn:hover { background: #a00000; }
        .footer-link { margin-top: 20px; display: block; color: #800000; text-decoration: none; font-size: 14px; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <div style="margin-bottom: 15px;">
        <img src="/assets/images/logo/favicon.png" alt="Church Life Africa" style="height: 50px;">
    </div>
    <h2>Bible Reflection Badge</h2>
    <p style="margin-bottom:20px;">Personalized for <strong>Church Life Africa</strong></p>
    
    <div class="input-group">
        <label>Full Name</label>
        <input type="text" id="nameInput" placeholder="Enter your name">
    </div>

    <div class="input-group">
        <label>Your Photo</label>
        <input type="file" id="upload" accept="image/*">
    </div>
    
    <canvas id="canvas" width="1080" height="1080"></canvas>
    
    <button id="generateBtn" class="btn">Generate Badge</button>
    <button id="downloadBtn" class="btn" style="display: none; background: #f4b41a; color: #002147;">Download My Badge</button>
    
    <a href="/index.html" class="footer-link">← Back to Home</a>
</div>

<script>
    const nameInput = document.getElementById('nameInput');
    const upload = document.getElementById('upload');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const generateBtn = document.getElementById('generateBtn');
    const downloadBtn = document.getElementById('downloadBtn');

    // Load Favicon/Logo for the Canvas
    const logoImg = new Image();
    logoImg.src = '/assets/images/logo/favicon.png'; 

    generateBtn.addEventListener('click', function() {
        if (!nameInput.value || !upload.files[0]) {
            alert("Please provide both your name and a photo!");
            return;
        }

        const reader = new FileReader();
        reader.onload = function(event) {
            const userImg = new Image();
            userImg.onload = function() {
                drawBadge(userImg, nameInput.value.toUpperCase());
            }
            userImg.src = event.target.result;
        }
        reader.readAsDataURL(upload.files[0]);
    });

    function drawBadge(userImg, attendeeName) {
        // 1. Solid Background (Navy)
        ctx.fillStyle = '#0f172a';
        ctx.fillRect(0, 0, 1080, 1080);

        // 2. Yellow Header Section
        ctx.fillStyle = '#f4b41a';
        ctx.fillRect(0, 0, 1080, 240);
        
        // 3. Draw Favicon/Logo on Canvas (Top Left)
        if (logoImg.complete) {
            ctx.drawImage(logoImg, 60, 60, 120, 120);
        }

        // 4. Church Life Africa Text Branding
        ctx.fillStyle = '#002147';
        ctx.textAlign = 'left';
        ctx.font = 'bold 30px Arial';
        ctx.fillText('CHURCH LIFE AFRICA', 200, 100);
        
        // 5. Title Text
        ctx.textAlign = 'center';
        ctx.font = 'bold 45px Arial';
        ctx.fillText('BIBLE IN A YEAR MONTHLY', 540, 150);
        ctx.font = '900 85px Georgia';
        ctx.fillText('REFLECTION', 540, 220);

        // 6. User Photo (Circular)
        ctx.save();
        ctx.beginPath();
        ctx.arc(540, 560, 300, 0, Math.PI * 2);
        ctx.closePath();
        ctx.clip();
        const scale = Math.max(600 / userImg.width, 600 / userImg.height);
        ctx.drawImage(userImg, 540 - (userImg.width * scale) / 2, 560 - (userImg.height * scale) / 2, userImg.width * scale, userImg.height * scale);
        ctx.restore();

        // 7. Golden Circular Border
        ctx.strokeStyle = '#f4b41a';
        ctx.lineWidth = 15;
        ctx.beginPath();
        ctx.arc(540, 560, 300, 0, Math.PI * 2);
        ctx.stroke();

        // 8. Attendee Name (Personalized)
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 65px Georgia';
        ctx.fillText(attendeeName, 540, 920);

        // 9. Call to Action
        ctx.fillStyle = '#f4b41a';
        ctx.font = 'italic 40px Georgia';
        ctx.fillText('I WILL BE ATTENDING', 540, 980);

        // 10. Event Details Bar (Maroon)
        ctx.fillStyle = '#800000';
        ctx.fillRect(240, 1005, 600, 50);
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 26px Arial';
        ctx.fillText('26 APRIL, 2026 | 8:00 PM WAT', 540, 1040);

        // Display results
        canvas.style.display = 'block';
        downloadBtn.style.display = 'block';
        generateBtn.innerText = "Change Photo/Name";
    }

    downloadBtn.addEventListener('click', function() {
        const link = document.createElement('a');
        link.download = `CLA-Reflection-Badge.png`;
        link.href = canvas.toDataURL('image/png');
        link.click();
    });
</script>

</body>
</html>
